<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0522d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b3410;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glare">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Cristal de la lupa -->
  <circle cx="13" cy="13" r="9" fill="url(#glass)" opacity="0.3"/>
  <circle cx="13" cy="13" r="9" fill="none" stroke="url(#glass)" stroke-width="2.5"/>
  <!-- Marco interior -->
  <circle cx="13" cy="13" r="7.5" fill="none" stroke="#999" stroke-width="1"/>
  <!-- Mango -->
  <line x1="19.5" y1="19.5" x2="28" y2="28" stroke="url(#handle)" stroke-width="4" stroke-linecap="round"/>
  <!-- Reflejo en el cristal -->
  <circle cx="10" cy="10" r="4" fill="url(#glare)"/>
  <ellipse cx="15" cy="12" rx="2" ry="1" fill="#fff" opacity="0.5"/>
</svg>
