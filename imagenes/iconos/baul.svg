<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0522d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b3410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9b037;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4e58c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a08020;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="58" rx="24" ry="4" fill="#000" opacity="0.2"/>

  <!-- Base del baúl -->
  <rect x="12" y="30" width="40" height="24" rx="2" fill="url(#wood)" stroke="#5a2d0c" stroke-width="1.5"/>

  <!-- Tapa del baúl -->
  <path d="M 12 30 Q 12 18 32 18 Q 52 18 52 30 L 52 32 L 12 32 Z" fill="url(#wood)" stroke="#5a2d0c" stroke-width="1.5"/>

  <!-- Cerradura -->
  <rect x="30" y="38" width="4" height="6" rx="1" fill="url(#metal)"/>
  <circle cx="32" cy="41" r="2.5" fill="#d4af37"/>
  <rect x="31" y="41" width="2" height="4" fill="#a08020"/>

  <!-- Bandas metálicas horizontales -->
  <rect x="12" y="36" width="40" height="2" fill="url(#metal)" opacity="0.8"/>
  <rect x="12" y="48" width="40" height="2" fill="url(#metal)" opacity="0.8"/>

  <!-- Bandas metálicas verticales -->
  <rect x="18" y="30" width="2" height="24" fill="url(#metal)" opacity="0.8"/>
  <rect x="44" y="30" width="2" height="24" fill="url(#metal)" opacity="0.8"/>

  <!-- Detalles de madera -->
  <line x1="16" y1="32" x2="16" y2="54" stroke="#5a2d0c" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="32" x2="24" y2="54" stroke="#5a2d0c" stroke-width="0.5" opacity="0.5"/>
  <line x1="40" y1="32" x2="40" y2="54" stroke="#5a2d0c" stroke-width="0.5" opacity="0.5"/>
  <line x1="48" y1="32" x2="48" y2="54" stroke="#5a2d0c" stroke-width="0.5" opacity="0.5"/>

  <!-- Brillo en la tapa -->
  <ellipse cx="28" cy="24" rx="8" ry="4" fill="url(#shine)"/>

  <!-- Lazo de regalo en la parte superior -->
  <path d="M 26 18 Q 22 12 18 14 Q 16 16 18 18 Q 22 20 26 18" fill="#dc143c" stroke="#8b0000" stroke-width="0.5"/>
  <path d="M 38 18 Q 42 12 46 14 Q 48 16 46 18 Q 42 20 38 18" fill="#dc143c" stroke="#8b0000" stroke-width="0.5"/>
  <rect x="30" y="16" width="4" height="6" fill="#dc143c" stroke="#8b0000" stroke-width="0.5"/>
  <path d="M 32 16 L 28 8 L 32 10 L 36 8 Z" fill="#dc143c" stroke="#8b0000" stroke-width="0.5"/>
</svg>
