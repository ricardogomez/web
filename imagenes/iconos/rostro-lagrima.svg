<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente para dar volumen a la cara -->
    <radialGradient id="faceGradient" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="100%" style="stop-color:#E8A800"/>
    </radialGradient>
    <!-- Gradiente para la lágrima -->
    <linearGradient id="tearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#4A90D9"/>
    </linearGradient>
    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cara con gradiente y sombra -->
  <circle cx="50" cy="50" r="42" fill="url(#faceGradient)" stroke="#D4920A" stroke-width="2" filter="url(#shadow)"/>

  <!-- Brillo superior -->
  <ellipse cx="38" cy="32" rx="15" ry="8" fill="rgba(255,255,255,0.3)"/>

  <!-- Cejas tristes -->
  <path d="M24 30 Q34 24 44 32" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M56 32 Q66 24 76 30" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Ojo izquierdo -->
  <ellipse cx="35" cy="44" rx="6" ry="7" fill="#333"/>
  <ellipse cx="33" cy="42" rx="2" ry="2" fill="white"/>

  <!-- Ojo derecho -->
  <ellipse cx="65" cy="44" rx="6" ry="7" fill="#333"/>
  <ellipse cx="63" cy="42" rx="2" ry="2" fill="white"/>

  <!-- Boca triste -->
  <path d="M32 72 Q50 60 68 72" stroke="#8B4513" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Lágrima con gradiente -->
  <path d="M65 54 Q70 65 65 76 Q60 65 65 54" fill="url(#tearGradient)"/>
  <ellipse cx="64" cy="58" rx="2.5" ry="2" fill="rgba(255,255,255,0.6)"/>
</svg>
