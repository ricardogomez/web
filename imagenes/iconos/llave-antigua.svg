<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cd7f32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b8733c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Sombra -->
  <ellipse cx="34" cy="60" rx="18" ry="3" fill="#000" opacity="0.15"/>
  <!-- Cabeza de la llave (círculo exterior) -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="url(#bronze)" stroke-width="4"/>
  <circle cx="20" cy="20" r="14" fill="url(#bronze)" opacity="0.2"/>
  <!-- Círculo interior -->
  <circle cx="20" cy="20" r="7" fill="none" stroke="url(#bronze)" stroke-width="4"/>
  <!-- Decoración en la cabeza -->
  <path d="M 20 13 L 20 6" stroke="url(#bronze)" stroke-width="3" stroke-linecap="round"/>
  <!-- Cuerpo de la llave -->
  <rect x="28" y="17" width="28" height="6" fill="url(#bronze)" rx="2"/>
  <!-- Dientes de la llave -->
  <rect x="42" y="23" width="4" height="8" fill="url(#bronze)" rx="1"/>
  <rect x="48" y="23" width="4" height="12" fill="url(#bronze)" rx="1"/>
  <rect x="54" y="23" width="3" height="6" fill="url(#bronze)" rx="1"/>
  <!-- Brillos -->
  <circle cx="16" cy="16" r="4" fill="url(#shine)"/>
  <circle cx="24" cy="18" r="2" fill="#fff" opacity="0.5"/>
  <ellipse cx="38" cy="19" rx="3" ry="1.5" fill="#fff" opacity="0.4"/>
  <!-- Detalles decorativos -->
  <circle cx="20" cy="20" r="3" fill="url(#bronze)" opacity="0.5"/>
</svg>
