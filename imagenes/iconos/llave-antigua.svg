<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cd7f32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cabeza de la llave -->
  <circle cx="10" cy="10" r="6" fill="none" stroke="url(#bronze)" stroke-width="2"/>
  <circle cx="10" cy="10" r="3" fill="none" stroke="url(#bronze)" stroke-width="2"/>
  <!-- Cuerpo de la llave -->
  <rect x="13" y="9" width="12" height="2" fill="url(#bronze)"/>
  <!-- Dientes -->
  <rect x="20" y="11" width="2" height="3" fill="url(#bronze)"/>
  <rect x="23" y="11" width="2" height="5" fill="url(#bronze)"/>
