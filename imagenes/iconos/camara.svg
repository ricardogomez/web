<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="camera-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lens-black" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="lens-shine">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#888;stop-opacity:0.2" />
    </radialGradient>
    <radialGradient id="flash-red" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="59" rx="24" ry="4" fill="#000" opacity="0.25"/>

  <!-- Cuerpo de la cámara con volumen -->
  <rect x="8" y="22" width="48" height="32" rx="4" fill="url(#camera-body)" stroke="#999" stroke-width="2"/>
  <rect x="9" y="23" width="46" height="2" fill="#ffffff" opacity="0.6"/>

  <!-- Visor superior -->
  <rect x="16" y="16" width="14" height="8" rx="2" fill="url(#camera-body)" stroke="#999" stroke-width="1.2"/>

  <!-- Flash ROJO con brillo -->
  <circle cx="48" cy="29" r="4.5" fill="url(#flash-red)" stroke="#990000" stroke-width="1.2"/>
  <circle cx="47" cy="28" r="1.5" fill="#ff6666" opacity="0.8"/>

  <!-- Anillo del lente con volumen -->
  <circle cx="32" cy="38" r="12" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="32" cy="38" r="11" fill="#444" stroke="#222" stroke-width="1"/>

  <!-- Lente negro central grande -->
  <circle cx="32" cy="38" r="9" fill="url(#lens-black)" stroke="#000" stroke-width="1.5"/>

  <!-- Círculo negro interior para profundidad -->
  <circle cx="32" cy="38" r="6" fill="#000000"/>

  <!-- Reflejo interior del lente -->
  <circle cx="32" cy="38" r="4" fill="#0a0a0a"/>

  <!-- Brillo en la lente -->
  <circle cx="28" cy="34" r="2.5" fill="url(#lens-shine)" opacity="0.7"/>
  <circle cx="30" cy="36" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Botón de disparo -->
  <rect x="38" y="14" width="7" height="5" rx="1.5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>

  <!-- Detalles decorativos con sombras -->
  <rect x="12" y="28" width="3" height="3" rx="0.5" fill="#cccccc" opacity="0.6"/>
  <circle cx="14" cy="48" r="1.5" fill="#999" opacity="0.5"/>

  <!-- Correa -->
  <path d="M 10 22 Q 6 18 6 14 Q 6 10 10 10 L 14 10" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M 54 22 Q 58 18 58 14 Q 58 10 54 10 L 50 10" stroke="#555" stroke-width="2" fill="none"/>
</svg>
