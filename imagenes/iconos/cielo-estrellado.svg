<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cuadrado de cielo nocturno -->
  <rect x="3" y="3" width="26" height="26" rx="3" ry="3" fill="url(#sky)" stroke="#3a3a6e" stroke-width="1"/>
  <!-- Estrellas grandes -->
  <circle cx="10" cy="9" r="1.2" fill="#fffde0" opacity="0.95"/>
  <circle cx="22" cy="7" r="1" fill="#fffde0" opacity="0.9"/>
  <circle cx="16" cy="14" r="1.3" fill="#fff8c4" opacity="1"/>
  <circle cx="25" cy="17" r="0.9" fill="#fffde0" opacity="0.85"/>
  <circle cx="8" cy="20" r="1.1" fill="#fffde0" opacity="0.9"/>
  <!-- Estrellas pequeñas -->
  <circle cx="14" cy="7" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="19" cy="11" r="0.5" fill="#fff" opacity="0.55"/>
  <circle cx="7" cy="14" r="0.4" fill="#fff" opacity="0.5"/>
  <circle cx="24" cy="12" r="0.5" fill="#fff" opacity="0.6"/>
  <circle cx="12" cy="17" r="0.4" fill="#fff" opacity="0.5"/>
  <circle cx="20" cy="22" r="0.5" fill="#fff" opacity="0.55"/>
  <circle cx="13" cy="23" r="0.4" fill="#fff" opacity="0.5"/>
  <!-- Destellos en estrella central -->
  <line x1="16" y1="11.5" x2="16" y2="12.5" stroke="#fff8c4" stroke-width="0.4" opacity="0.7"/>
  <line x1="16" y1="15.5" x2="16" y2="16.5" stroke="#fff8c4" stroke-width="0.4" opacity="0.7"/>
  <line x1="13.5" y1="14" x2="14.5" y2="14" stroke="#fff8c4" stroke-width="0.4" opacity="0.7"/>
  <line x1="17.5" y1="14" x2="18.5" y2="14" stroke="#fff8c4" stroke-width="0.4" opacity="0.7"/>
</svg>
