<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog 6 - Ricardo Gómez</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .cuaderno {
            position: relative;
            background: #fffef5;
            width: 85vw;
            max-width: 900px;
            min-height: 80vh;
            padding: 0;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.05);
            border-radius: 4px;
            background-image: repeating-linear-gradient(
                transparent,
                transparent calc(2rem - 1px),
                #c8daf0 calc(2rem - 1px),
                #c8daf0 2rem
            );
        }

        .cuaderno-cerrar {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 36px;
            color: #999;
            cursor: pointer;
            text-decoration: none;
            font-family: Arial, sans-serif;
            z-index: 10;
            transition: color 0.2s;
        }

        .cuaderno-cerrar:hover {
            color: #c0392b;
        }

        .cuaderno-cabecera {
            padding: 24px 50px 12px 50px;
            border-bottom: 2px solid #c0392b;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: #333;
        }

        .cuaderno-contenido {
            padding: 0 50px 40px 50px;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 1.15rem;
            color: #333;
            line-height: 2rem;
        }

        .cuaderno-contenido p {
            margin: 0;
            padding-top: 0.5rem;
        }

        /* Doble margen rojo izquierdo tipo cuaderno */
        .cuaderno::before {
            content: '';
            position: absolute;
            top: 0;
            left: 38px;
            width: 2px;
            height: 100%;
            background: #e8b4b4;
        }

        .cuaderno::after {
            content: '';
            position: absolute;
            top: 0;
            left: 43px;
            width: 2px;
            height: 100%;
            background: #e8b4b4;
        }
        @media (max-width: 600px) {
            .cuaderno-cabecera {
                padding: 20px 25px 10px 25px;
            }
            .cuaderno-contenido {
                padding: 0 25px 30px 25px;
            }
            .cuaderno::before {
                left: 18px;
            }
            .cuaderno::after {
                left: 23px;
            }
        }
    </style>
</head>
<body>
    <div class="cuaderno">
        <a href="index.html" class="cuaderno-cerrar">&times;</a>
        <div class="cuaderno-cabecera">
        </div>
        <div class="cuaderno-contenido">
        </div>
    </div>
</body>
</html>
